[[checks]]
id = "bounded-write-recency-inline"
command = ["node", "--experimental-strip-types", "--input-type=module", "-e", "import assert from 'node:assert/strict'; import {clearDiagramCache,readDiagramCache,writeDiagramCache} from './apps/desktop/src/markdown/renderCache.ts'; clearDiagramCache(); writeDiagramCache('hot',{svg:'old',diagramType:'flowchart'}); for(let i=0;i<63;i++) writeDiagramCache(String(i),{svg:String(i),diagramType:'flowchart'}); writeDiagramCache('hot',{svg:'new',diagramType:'flowchart'}); writeDiagramCache('overflow',{svg:'overflow',diagramType:'flowchart'}); assert.equal(readDiagramCache('hot')?.svg,'new'); assert.equal(readDiagramCache('0'),undefined); assert.equal(readDiagramCache('62')?.svg,'62');"]
timeout_ms = 30000
