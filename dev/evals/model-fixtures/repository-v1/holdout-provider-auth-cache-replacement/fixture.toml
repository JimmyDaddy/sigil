[[checks]]
id = "prior-success-invalidated-after-auth-failure"
command = ["node", "--experimental-strip-types", "--input-type=module", "-e", "import assert from 'node:assert/strict'; import {loadAndCacheProviderCatalog as load,readProviderCatalogCache as read} from './apps/desktop/src/features/settings/providerCatalogCache.ts'; const input={template:'open_ai_compatible',protocol:'chat_completions',endpoint:'http://localhost/v1',credentialSource:'environment',apiKey:'fixture-A'}; const result={state:'remote',models:[],manualEntryAllowed:true}; await load({providerSetupCatalog:async()=>result},'rotated',input); assert.deepEqual(await read('rotated',input),{catalog:result,stale:false}); await load({providerSetupCatalog:async()=>({state:'auth_rejected',models:[]})},'rotated',input); assert.equal(await read('rotated',input),undefined);"]
timeout_ms = 30000
