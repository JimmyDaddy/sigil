# RFC-0071 section 9.5: shipping targets (R71.4 state).
# R71.4 moved the three release-owner commands out of the shipping sigil binary into the
# nonshipping sigil-release-tools package; blocker count must be zero for enforce mode.

schema_version = 1

[shipping_roots]
paths = [
  "crates/sigil/sigil",
  "apps/desktop/src-tauri/sigil-desktop-app",
  "apps/desktop/src-tauri/sigil (bundled sidecar)",
  "npm package/archive",
  "release workflow artifacts",
]

[[shipping_roots.cargo_targets]]
package = "sigil"
bin = "sigil"

[[shipping_roots.cargo_targets]]
package = "sigil-desktop-app"
bin = "sigil-desktop-app"

[[release_only]]
target_package = "sigil-release-tools"
bins = [
  "sigil-model-eval",
  "sigil-model-eval-route-contract",
  "sigil-model-eval-rollout-manifest",
]
publish = false

[[release_only_evidence]]
# R71.4: the tools live only in the nonshipping package; shipping binary carries no command.
package = "sigil-release-tools"
bins = [
  "sigil-model-eval",
  "sigil-model-eval-route-contract",
  "sigil-model-eval-rollout-manifest",
]
blockers = 0
resolved_slice = "R71.4"
