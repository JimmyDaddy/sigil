name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish npm, GitHub Release, and Homebrew after all builds pass"
        required: true
        default: false
        type: boolean
      tag:
        description: "Existing tag to publish; ignored when publish is false"
        required: false
        type: string
      orchestration_eval_manifest_url:
        description: "Optional HTTPS URL for an exact-build qualified RFC-0053 report"
        required: false
        type: string
      orchestration_eval_manifest_sha256:
        description: "Required SHA-256 when an orchestration report URL is supplied"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APPLE_TEAM_ID: 9Q6HK7T78S
  CARGO_TERM_COLOR: always
  HOMEBREW_TAP_REPOSITORY: JimmyDaddy/homebrew-sigil
  RUST_TOOLCHAIN_VERSION: 1.94.1

jobs:
  validate-mode:
    name: Validate release mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag || github.ref }}

      - name: Validate manual publish inputs
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
          ORCHESTRATION_EVAL_MANIFEST_URL: ${{ inputs.orchestration_eval_manifest_url }}
          ORCHESTRATION_EVAL_MANIFEST_SHA256: ${{ inputs.orchestration_eval_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${PUBLISH}" == "true" ]]; then
            if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
              echo "manual publish requires an existing v-prefixed tag" >&2
              exit 1
            fi
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${PUBLISH}" != "true" ]]; then
            RELEASE_TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          fi
          version="${RELEASE_TAG#v}"
          case "${version}" in
            *-alpha | *-alpha.* | *-beta | *-beta.*) ;;
            *-*)
              echo "unsupported prerelease channel in ${RELEASE_TAG}; expected alpha or beta" >&2
              exit 1
              ;;
            *) ;;
          esac
          if [[ -n "${ORCHESTRATION_EVAL_MANIFEST_URL}" || -n "${ORCHESTRATION_EVAL_MANIFEST_SHA256}" ]]; then
            if [[ -z "${ORCHESTRATION_EVAL_MANIFEST_URL}" || -z "${ORCHESTRATION_EVAL_MANIFEST_SHA256}" ]]; then
              echo "orchestration report URL and SHA-256 must be supplied together" >&2
              exit 1
            fi
            if [[ "${ORCHESTRATION_EVAL_MANIFEST_URL}" != https://* ]]; then
              echo "orchestration report URL must use HTTPS" >&2
              exit 1
            fi
            if [[ ! "${ORCHESTRATION_EVAL_MANIFEST_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "orchestration report SHA-256 must contain 64 hexadecimal characters" >&2
              exit 1
            fi
          fi
          doctor_args=(--tag "${RELEASE_TAG}")
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${PUBLISH}" == "true" ]]; then
            doctor_args+=(--require-head-tag)
          fi
          node scripts/release-doctor.mjs "${doctor_args[@]}"

  build:
    name: Build ${{ matrix.os }}
    needs: validate-mode
    if: ${{ github.event_name == 'push' || !inputs.publish }}
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag || github.ref }}

      - name: Install Rust
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}"
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Build release archive
        shell: bash
        env:
          ORCHESTRATION_EVAL_MANIFEST_URL: ${{ inputs.orchestration_eval_manifest_url }}
          ORCHESTRATION_EVAL_MANIFEST_SHA256: ${{ inputs.orchestration_eval_manifest_sha256 }}
        run: |
          set -euo pipefail
          archive_args=(--out-dir dist)
          if [[ -n "${ORCHESTRATION_EVAL_MANIFEST_URL}" ]]; then
            report_path="${RUNNER_TEMP}/orchestration-eval-manifest.json"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "${report_path}" \
              "${ORCHESTRATION_EVAL_MANIFEST_URL}"
            if command -v sha256sum >/dev/null 2>&1; then
              actual_sha256="$(sha256sum "${report_path}" | awk '{print $1}')"
            else
              actual_sha256="$(shasum -a 256 "${report_path}" | awk '{print $1}')"
            fi
            if [[ "${actual_sha256,,}" != "${ORCHESTRATION_EVAL_MANIFEST_SHA256,,}" ]]; then
              echo "orchestration report checksum mismatch" >&2
              exit 1
            fi
            archive_args+=(--orchestration-eval-manifest "${report_path}")
          fi
          scripts/build-release-archive.sh "${archive_args[@]}"

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sigil-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  stage-release:
    name: Stage draft release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm CLI
        shell: bash
        run: npm install --global npm@11.18.0

      - name: Verify exact tagged source and green CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-doctor.mjs \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --require-head-tag \
            --require-remote-tag \
            --require-ci \
            --require-workflow CI \
            --require-workflow "Desktop Package" \
            --require-public-channel \
            --wait-ci-seconds 1800

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          mkdir -p dist
          find release-artifacts -maxdepth 3 -type f -exec cp {} dist/ \;
          cat dist/*.sha256 | sort -k2 > dist/checksums.txt
          scripts/generate-release-notes.sh "${RELEASE_TAG}" > RELEASE_NOTES.md

          darwin_arm_archive="$(find dist -maxdepth 1 -name 'sigil-*-aarch64-apple-darwin.tar.gz' | sort | head -n 1)"
          darwin_intel_archive="$(find dist -maxdepth 1 -name 'sigil-*-x86_64-apple-darwin.tar.gz' | sort | head -n 1)"
          if [[ -n "${darwin_arm_archive}" && -n "${darwin_intel_archive}" ]]; then
            arm_name="$(basename "${darwin_arm_archive}")"
            arm_sha="$(awk '{print $1}' "${darwin_arm_archive}.sha256")"
            intel_name="$(basename "${darwin_intel_archive}")"
            intel_sha="$(awk '{print $1}' "${darwin_intel_archive}.sha256")"
            scripts/render-homebrew-formula.sh \
              --version "${RELEASE_TAG#v}" \
              --arm-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${arm_name}" \
              --arm-sha256 "${arm_sha}" \
              --intel-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${intel_name}" \
              --intel-sha256 "${intel_sha}" \
              --formula-name sigil-ai \
              --output dist/sigil-ai.rb
          elif [[ -n "${darwin_arm_archive}" || -n "${darwin_intel_archive}" ]]; then
            darwin_archive="${darwin_arm_archive:-${darwin_intel_archive}}"
            archive_name="$(basename "${darwin_archive}")"
            archive_sha="$(awk '{print $1}' "${darwin_archive}.sha256")"
            scripts/render-homebrew-formula.sh \
              --version "${RELEASE_TAG#v}" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${archive_name}" \
              --sha256 "${archive_sha}" \
              --formula-name sigil-ai \
              --output dist/sigil-ai.rb
          fi

          scripts/prepare-npm-packages.sh \
            --version "${RELEASE_TAG#v}" \
            --dist-dir dist \
            --out-dir release-npm-packages \
            --pack-destination dist

          node scripts/release-candidate.mjs create \
            --tag "${RELEASE_TAG}" \
            --commit "$(git rev-parse "${RELEASE_TAG}^{commit}")" \
            --asset-dir dist \
            --output "dist/sigil-${RELEASE_TAG#v}-candidate.json"

          {
            echo
            echo "## Release assets"
            echo
            for asset in dist/*; do
              echo "- \`$(basename "${asset}")\`"
            done
          } >> RELEASE_NOTES.md

      - name: Stage draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--draft)
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--prerelease=false)
          fi

          if release="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets,isDraft,tagName 2>/dev/null
          )"; then
            test "$(jq -r '.tagName' <<<"${release}")" = "${RELEASE_TAG}"
            if [[ "$(jq -r '.isDraft' <<<"${release}")" != "true" ]]; then
              echo "release ${RELEASE_TAG} is already public; preserving its immutable assets"
              exit 0
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sigil ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              "${release_flags[@]}"
            release="$(
              gh release view "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets,isDraft,tagName
            )"
          fi
          existing_dir="${RUNNER_TEMP}/sigil-existing-release-assets"
          mkdir -p "${existing_dir}"
          mapfile -t existing_names < <(jq -r '.assets[].name' <<<"${release}")
          for asset_path in dist/*; do
            asset_name="$(basename "${asset_path}")"
            if printf '%s\n' "${existing_names[@]}" | grep -Fxq -- "${asset_name}"; then
              asset_dir="${existing_dir}/${asset_name}"
              mkdir -p "${asset_dir}"
              gh release download "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${asset_name}" \
                --dir "${asset_dir}"
              if ! cmp -s "${asset_path}" "${asset_dir}/${asset_name}"; then
                echo "draft asset ${asset_name} differs from the exact tagged candidate" >&2
                exit 1
              fi
              echo "keeping identical draft asset: ${asset_name}"
            else
              gh release upload "${RELEASE_TAG}" "${asset_path}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
          done
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Sigil ${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_flags[@]}"

  prepare-publication:
    name: Verify staged candidate
    needs: validate-mode
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      # Draft releases require repository write visibility. This job mutates only
      # latest.json after every Desktop byte has passed local checksum/signature checks.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout staged tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          package-manager-cache: false

      - name: Install Rust signature verifier
        if: ${{ contains(inputs.tag, '-beta.') }}
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}"
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Download and verify the exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          candidate_dir="release-publication-inputs"
          mkdir -p "${candidate_dir}"
          node scripts/release-doctor.mjs \
            --tag "${RELEASE_TAG}" \
            --require-head-tag
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "sigil-${version}-candidate.json" \
            --pattern 'sigil-ai-sigil-*.tgz' \
            --dir "${candidate_dir}"
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets,isDraft,isImmutable,tagName \
            > "${candidate_dir}/release.json"
          node scripts/release-candidate.mjs verify \
            --manifest "${candidate_dir}/sigil-${version}-candidate.json" \
            --tag "${RELEASE_TAG}" \
            --commit "${commit}" \
            --release-json "${candidate_dir}/release.json"

      - name: Verify beta Desktop assets and stage update manifest
        if: ${{ contains(inputs.tag, '-beta.') }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets,isDraft,tagName
          )"
          test "$(jq -r '.tagName' <<<"${release}")" = "${RELEASE_TAG}"
          is_draft="$(jq -r '.isDraft' <<<"${release}")"
          mapfile -t asset_names < <(jq -r '.assets[].name' <<<"${release}")

          desktop_dir="${RUNNER_TEMP}/sigil-desktop-release"
          mkdir -p "${desktop_dir}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            expected=(
              "Sigil_${version}_${target}.dmg"
              "Sigil_${version}_${target}.dmg.sha256"
              "Sigil_${version}_${target}.app.tar.gz"
              "Sigil_${version}_${target}.app.tar.gz.sha256"
              "Sigil_${version}_${target}.app.tar.gz.sig"
            )
            for asset in "${expected[@]}"; do
              if ! printf '%s\n' "${asset_names[@]}" | grep -Fxq -- "${asset}"; then
                echo "draft release is missing required Desktop asset: ${asset}" >&2
                exit 1
              fi
              gh release download "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${asset}" \
                --dir "${desktop_dir}"
              test -s "${desktop_dir}/${asset}"
            done
            (
              cd "${desktop_dir}"
              shasum -a 256 --check "Sigil_${version}_${target}.dmg.sha256"
              shasum -a 256 --check "Sigil_${version}_${target}.app.tar.gz.sha256"
            )
            scripts/verify-desktop-update-signature.sh \
              --archive "${desktop_dir}/Sigil_${version}_${target}.app.tar.gz" \
              --signature "${desktop_dir}/Sigil_${version}_${target}.app.tar.gz.sig"
          done

          node scripts/generate-desktop-update-manifest.mjs \
            --version "${version}" \
            --artifact-dir "${desktop_dir}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pub-date "$(git show -s --format=%cI "${RELEASE_TAG}")" \
            --notes "Sigil Desktop ${version} beta update. See the release notes for details." \
            --output "${desktop_dir}/latest.json"
          if printf '%s\n' "${asset_names[@]}" | grep -Fxq latest.json; then
            published_dir="${desktop_dir}/published"
            mkdir -p "${published_dir}"
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern latest.json \
              --dir "${published_dir}"
            cmp "${desktop_dir}/latest.json" "${published_dir}/latest.json"
          elif [[ "${is_draft}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" "${desktop_dir}/latest.json" \
              --repo "${GITHUB_REPOSITORY}"
          else
            echo "published beta release is missing immutable latest.json" >&2
            exit 1
          fi
          cp "${desktop_dir}/latest.json" release-publication-inputs/latest.json

      - name: Pass verified npm tarballs to publication
        uses: actions/upload-artifact@v7
        with:
          name: release-publication-inputs
          path: |
            release-publication-inputs/sigil-*-candidate.json
            release-publication-inputs/sigil-ai-sigil-*.tgz
            release-publication-inputs/latest.json
          if-no-files-found: error
          retention-days: 1

  verify-desktop-macos:
    name: Verify Desktop ${{ matrix.label }}
    needs: prepare-publication
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          contains(inputs.tag, '-beta.') }}
    runs-on: ${{ matrix.os }}
    permissions:
      # Draft releases are visible only to tokens with repository push access.
      # This job performs read-only commands against that draft.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout published candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust signature verifier
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}"
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Download exact Desktop candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isImmutable,tagName
          )"
          test "$(jq -r '.tagName' <<<"${release}")" = "${RELEASE_TAG}"
          if [[ "$(jq -r '.isDraft' <<<"${release}")" != "true" ]] &&
            [[ "$(jq -r '.isImmutable // false' <<<"${release}")" != "true" ]]; then
            echo "public Desktop candidate is not immutable" >&2
            exit 1
          fi

          desktop_dir="${RUNNER_TEMP}/sigil-desktop-release"
          mkdir -p "${desktop_dir}"
          for suffix in dmg dmg.sha256 app.tar.gz app.tar.gz.sha256 app.tar.gz.sig; do
            asset="Sigil_${version}_${TARGET}.${suffix}"
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" \
              --dir "${desktop_dir}"
            test -s "${desktop_dir}/${asset}"
          done

      - name: Verify checksums, updater signature, and Apple trust
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_commit="$(git rev-parse --short=12 "${RELEASE_TAG}^{commit}")"
          desktop_dir="${RUNNER_TEMP}/sigil-desktop-release"
          dmg="${desktop_dir}/Sigil_${version}_${TARGET}.dmg"
          archive="${desktop_dir}/Sigil_${version}_${TARGET}.app.tar.gz"
          (
            cd "${desktop_dir}"
            shasum -a 256 --check "$(basename "${dmg}").sha256"
            shasum -a 256 --check "$(basename "${archive}").sha256"
          )
          scripts/verify-desktop-update-signature.sh \
            --archive "${archive}" \
            --signature "${archive}.sig"
          scripts/verify-desktop-macos.sh \
            --dmg "${dmg}" \
            --expected-arch "${EXPECTED_ARCHITECTURE}" \
            --team-id "${APPLE_TEAM_ID}" \
            --expected-version "${version}" \
            --expected-commit "${expected_commit}" \
            --notarized

          extract_dir="${RUNNER_TEMP}/sigil-desktop-updater-app"
          python3 scripts/extract-verified-desktop-updater-app.py \
            --archive "${archive}" \
            --destination "${extract_dir}"
          scripts/verify-desktop-macos-app.sh \
            --app "${extract_dir}/Sigil.app" \
            --expected-arch "${EXPECTED_ARCHITECTURE}" \
            --team-id "${APPLE_TEAM_ID}" \
            --expected-version "${version}" \
            --expected-commit "${expected_commit}" \
            --notarized

      - name: Record verified Desktop candidate digests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          desktop_dir="${RUNNER_TEMP}/sigil-desktop-release"
          receipt_dir="${RUNNER_TEMP}/sigil-desktop-verification"
          mkdir -p "${receipt_dir}"
          {
            printf 'tag=%s\n' "${RELEASE_TAG}"
            printf 'target=%s\n' "${TARGET}"
            printf 'version=%s\n' "${version}"
            printf 'commit=%s\n' "$(git rev-parse --short=12 "${RELEASE_TAG}^{commit}")"
            printf 'dmg_sha256=%s\n' "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${TARGET}.dmg" |
                awk '{print $1}'
            )"
            printf 'archive_sha256=%s\n' "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${TARGET}.app.tar.gz" |
                awk '{print $1}'
            )"
            printf 'dmg_checksum_sha256=%s\n' "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${TARGET}.dmg.sha256" |
                awk '{print $1}'
            )"
            printf 'archive_checksum_sha256=%s\n' "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${TARGET}.app.tar.gz.sha256" |
                awk '{print $1}'
            )"
            printf 'signature_sha256=%s\n' "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${TARGET}.app.tar.gz.sig" |
                awk '{print $1}'
            )"
          } > "${receipt_dir}/${TARGET}.txt"

      - name: Upload Desktop verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: desktop-verification-${{ matrix.target }}
          path: ${{ runner.temp }}/sigil-desktop-verification/${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish immutable release and npm
    needs:
      - prepare-publication
      - verify-desktop-macos
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          needs.prepare-publication.result == 'success' &&
          (!contains(inputs.tag, '-beta.') ||
           needs.verify-desktop-macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-publication-${{ contains(inputs.tag, '-alpha.') && 'alpha' || contains(inputs.tag, '-beta.') && 'beta' || 'stable' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm CLI
        shell: bash
        run: npm install --global npm@11.18.0

      - name: Download verified publication inputs
        uses: actions/download-artifact@v8
        with:
          name: release-publication-inputs
          path: release-publication-inputs

      - name: Recheck staged TUI and npm candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          remote_manifest_dir="${RUNNER_TEMP}/sigil-remote-candidate-manifest"
          mkdir -p "${remote_manifest_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "sigil-${version}-candidate.json" \
            --dir "${remote_manifest_dir}"
          cmp \
            "release-publication-inputs/sigil-${version}-candidate.json" \
            "${remote_manifest_dir}/sigil-${version}-candidate.json"
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets,isDraft,isImmutable,tagName \
            > "${remote_manifest_dir}/release.json"
          node scripts/release-candidate.mjs verify \
            --manifest "release-publication-inputs/sigil-${version}-candidate.json" \
            --tag "${RELEASE_TAG}" \
            --commit "${commit}" \
            --release-json "${remote_manifest_dir}/release.json"
          for tarball in release-publication-inputs/sigil-ai-sigil-*.tgz; do
            expected_sha256="$(
              # shellcheck disable=SC2016
              node -e '
                const fs = require("node:fs");
                const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const asset = manifest.assets.find(({ name }) => name === process.argv[2]);
                if (!asset) throw new Error(`missing candidate asset ${process.argv[2]}`);
                process.stdout.write(asset.sha256);
              ' \
              "release-publication-inputs/sigil-${version}-candidate.json" \
              "$(basename "${tarball}")"
            )"
            test "$(sha256sum "${tarball}" | awk '{print $1}')" = "${expected_sha256}"
          done

      - name: Download Desktop verification receipts
        if: ${{ contains(inputs.tag, '-beta.') }}
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-verification-*
          path: desktop-verification
          merge-multiple: true

      - name: Recheck verified Desktop candidate bytes
        if: ${{ contains(inputs.tag, '-beta.') }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_commit="$(git rev-parse --short=12 "${RELEASE_TAG}^{commit}")"
          desktop_dir="${RUNNER_TEMP}/sigil-desktop-publication"
          mkdir -p "${desktop_dir}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            receipt="desktop-verification/${target}.txt"
            test -s "${receipt}"
            test "$(awk -F= '$1 == "tag" { print $2 }' "${receipt}")" = "${RELEASE_TAG}"
            test "$(awk -F= '$1 == "target" { print $2 }' "${receipt}")" = "${target}"
            test "$(awk -F= '$1 == "version" { print $2 }' "${receipt}")" = "${version}"
            test "$(awk -F= '$1 == "commit" { print $2 }' "${receipt}")" = "${expected_commit}"
            for suffix in dmg dmg.sha256 app.tar.gz app.tar.gz.sha256 app.tar.gz.sig; do
              asset="Sigil_${version}_${target}.${suffix}"
              gh release download "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${asset}" \
                --dir "${desktop_dir}"
              test -s "${desktop_dir}/${asset}"
            done
            test "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${target}.dmg" |
                awk '{print $1}'
            )" = "$(awk -F= '$1 == "dmg_sha256" { print $2 }' "${receipt}")"
            test "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${target}.app.tar.gz" |
                awk '{print $1}'
            )" = "$(awk -F= '$1 == "archive_sha256" { print $2 }' "${receipt}")"
            test "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${target}.dmg.sha256" |
                awk '{print $1}'
            )" = "$(awk -F= '$1 == "dmg_checksum_sha256" { print $2 }' "${receipt}")"
            test "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${target}.app.tar.gz.sha256" |
                awk '{print $1}'
            )" = "$(awk -F= '$1 == "archive_checksum_sha256" { print $2 }' "${receipt}")"
            test "$(
              shasum -a 256 "${desktop_dir}/Sigil_${version}_${target}.app.tar.gz.sig" |
                awk '{print $1}'
            )" = "$(awk -F= '$1 == "signature_sha256" { print $2 }' "${receipt}")"
          done
          latest_dir="${desktop_dir}/latest"
          mkdir -p "${latest_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json \
            --dir "${latest_dir}"
          cmp release-publication-inputs/latest.json "${latest_dir}/latest.json"

      - name: Verify channel monotonicity
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          case "${version}" in
            *-alpha.*) release_channel="alpha" ;;
            *-beta.*) release_channel="beta" ;;
            *-*) echo "unsupported prerelease channel: ${version}" >&2; exit 1 ;;
            *) release_channel="stable" ;;
          esac

          releases_file="${RUNNER_TEMP}/sigil-published-release-versions.json"
          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -c '[
              .[][] |
              select(.draft == false) |
              .tag_name |
              select(type == "string" and startswith("v")) |
              ltrimstr("v") |
              select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta)\\.[0-9]+)?$"))
            ]' > "${releases_file}"
          node scripts/release-channel-version.mjs \
            --candidate "${version}" \
            --channel "${release_channel}" \
            --observed-file "${releases_file}" \
            --surface "GitHub ${release_channel} releases"

          npm_error="${RUNNER_TEMP}/sigil-npm-channel-error.txt"
          if npm_tags="$(npm view "@sigil-ai/sigil" dist-tags --json 2>"${npm_error}")"; then
            npm_current="$(
              node -e '
                const tags = JSON.parse(process.argv[1]);
                const value = tags?.[process.argv[2]];
                if (typeof value === "string") process.stdout.write(value);
              ' "${npm_tags}" "$([[ "${release_channel}" == stable ]] && echo latest || echo "${release_channel}")"
            )"
            if [[ -n "${npm_current}" ]]; then
              node scripts/release-channel-version.mjs \
                --candidate "${version}" \
                --channel "${release_channel}" \
                --current "${npm_current}" \
                --surface "npm @sigil-ai/sigil"
            fi
          elif ! grep -Fq "E404" "${npm_error}"; then
            cat "${npm_error}" >&2
            echo "cannot prove npm channel state before release publication" >&2
            exit 1
          fi

      - name: Verify immutable releases policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SIGIL_RELEASE_ADMIN_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if ! policy="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases"
          )"; then
            echo "cannot prove GitHub immutable releases are enabled; configure SIGIL_RELEASE_ADMIN_TOKEN with repository Administration read access" >&2
            exit 1
          fi
          if [[ "$(jq -r '.enabled // false' <<<"${policy}")" != "true" ]]; then
            echo "GitHub immutable releases must be enabled before publication" >&2
            exit 1
          fi

      - name: Publish the completed draft
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--draft=false)
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--prerelease=false)
          fi
          release="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,tagName
          )"
          test "$(jq -r '.tagName' <<<"${release}")" = "${RELEASE_TAG}"
          if [[ "$(jq -r '.isDraft' <<<"${release}")" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sigil ${RELEASE_TAG}" \
              "${release_flags[@]}"
          else
            echo "release ${RELEASE_TAG} is already public; continuing idempotent publication"
          fi

      - name: Verify published release immutability
        shell: bash
        run: |
          set -euo pipefail
          release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"
          test "$(jq -r '.tag_name' <<<"${release}")" = "${RELEASE_TAG}"
          test "$(jq -r '.draft' <<<"${release}")" = "false"
          if [[ "$(jq -r '.immutable // false' <<<"${release}")" != "true" ]]; then
            echo "published release ${RELEASE_TAG} is not immutable; refusing downstream publication" >&2
            exit 1
          fi

      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          case "${version}" in
            *-alpha | *-alpha.*) npm_tag="alpha" ;;
            *-beta | *-beta.*) npm_tag="beta" ;;
            *-*)
              echo "unsupported prerelease channel in ${RELEASE_TAG}; expected alpha or beta" >&2
              exit 1
              ;;
            *) npm_tag="latest" ;;
          esac
          scripts/publish-npm-packages.sh \
            --version "${version}" \
            --package-tarballs-dir release-publication-inputs \
            --tag "${npm_tag}"

  dispatch-published-smoke:
    name: Start published distribution smoke
    needs: publish-release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          contains(inputs.tag, '-beta.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Dispatch exact published beta
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=sigil_published_distribution \
            -f "client_payload[tag]=${RELEASE_TAG}"

  publish-update-site:
    name: Publish Desktop update manifest
    needs: publish-release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          contains(inputs.tag, '-beta.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout published tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download immutable update manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_dir="${RUNNER_TEMP}/sigil-desktop-update"
          mkdir -p "${manifest_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json \
            --dir "${manifest_dir}"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const version = process.env.RELEASE_TAG.slice(1);
            if (manifest.version !== version) {
              throw new Error("Desktop update manifest version does not match release tag");
            }
            const expected = new Map([
              ["darwin-aarch64", "aarch64-apple-darwin"],
              ["darwin-x86_64", "x86_64-apple-darwin"],
            ]);
            if (
              manifest.platforms === null
              || typeof manifest.platforms !== "object"
              || Array.isArray(manifest.platforms)
              || Object.keys(manifest.platforms).sort().join(",")
                !== [...expected.keys()].sort().join(",")
            ) {
              throw new Error("Desktop update manifest has an unexpected platform inventory");
            }
            for (const [platform, target] of expected) {
              const entry = manifest.platforms[platform];
              const name = `Sigil_${version}_${target}.app.tar.gz`;
              const expectedUrl =
                `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${name}`;
              if (
                entry === null
                || typeof entry !== "object"
                || entry.url !== expectedUrl
                || typeof entry.signature !== "string"
                || entry.signature.length < 40
                || entry.signature.length > 4096
                || !/^[A-Za-z0-9+/]+={0,2}$/.test(entry.signature)
              ) {
                throw new Error(`unsafe Desktop update manifest entry for ${platform}`);
              }
            }
          ' "${manifest_dir}/latest.json"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Refuse Desktop update rollback
        shell: bash
        run: |
          set -euo pipefail
          current_manifest="${RUNNER_TEMP}/sigil-current-desktop-update.json"
          set +e
          http_status="$(
            curl --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "${current_manifest}" \
              --write-out '%{http_code}' \
              "https://sigil.corerobin.com/updates/beta/latest.json"
          )"
          curl_status=$?
          set -e
          if [[ "${curl_status}" -ne 0 ]]; then
            echo "cannot prove current Desktop update channel state" >&2
            exit 1
          fi
          case "${http_status}" in
            200)
              current_version="$(
                node -e '
                  const fs = require("node:fs");
                  const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  if (typeof manifest.version !== "string") {
                    throw new Error("current Desktop update manifest has no version");
                  }
                  process.stdout.write(manifest.version);
                ' "${current_manifest}"
              )"
              node scripts/release-channel-version.mjs \
                --candidate "${RELEASE_TAG#v}" \
                --channel beta \
                --current "${current_version}" \
                --surface "Pages Desktop beta"
              ;;
            404) ;;
            *)
              echo "cannot prove current Desktop update channel state: HTTP ${http_status}" >&2
              exit 1
              ;;
          esac

      - name: Build release website with update endpoint
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-pages-site.sh _site
          mkdir -p _site/updates/beta
          cp "${RUNNER_TEMP}/sigil-desktop-update/latest.json" _site/updates/beta/latest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  sync-homebrew:
    name: Sync Homebrew tap
    needs: publish-release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          contains(inputs.tag, '-beta.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sigil-homebrew-tap-sync
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          ref: main
          path: homebrew-sigil
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Download published formula
        shell: bash
        run: |
          set -euo pipefail
          formula_dir="${RUNNER_TEMP}/sigil-homebrew-formula"
          mkdir -p "${formula_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern sigil-ai.rb \
            --dir "${formula_dir}"
          test -s "${formula_dir}/sigil-ai.rb"

      - name: Commit and push formula
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          formula_source="${RUNNER_TEMP}/sigil-homebrew-formula/sigil-ai.rb"
          formula_target="homebrew-sigil/Formula/sigil-ai.rb"

          grep -Fq "version \"${version}\"" "${formula_source}"
          if [[ -f "${formula_target}" ]]; then
            # shellcheck disable=SC2016
            current_version="$(
              ruby -ne '
                if $_ =~ /^\s*version "([^"]+)"/
                  print Regexp.last_match(1)
                  exit
                end
              ' "${formula_target}"
            )"
            if [[ -z "${current_version}" ]]; then
              echo "cannot prove current Homebrew formula version" >&2
              exit 1
            fi
            node scripts/release-channel-version.mjs \
              --candidate "${version}" \
              --channel any \
              --current "${current_version}" \
              --surface "Homebrew tap"
          fi
          install -m 0644 "${formula_source}" "${formula_target}"
          ruby -c "${formula_target}"

          git -C homebrew-sigil add Formula/sigil-ai.rb
          if git -C homebrew-sigil diff --cached --quiet; then
            echo "Homebrew tap already references ${version}"
            exit 0
          fi

          git -C homebrew-sigil config user.name "github-actions[bot]"
          git -C homebrew-sigil config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-sigil commit -m "chore: update sigil-ai to ${version}"
          git -C homebrew-sigil push origin HEAD:main
