name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/desktop-package.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/published-distribution-smoke.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "fuzz/**"
      - "apps/desktop/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "dev/evals/**"
      - "scripts/coverage.sh"
      - "scripts/alpha-dogfood-campaign.py"
      - "scripts/test-alpha-dogfood-campaign.py"
      - "scripts/check-test-layout.py"
      - "scripts/check-no-prompt-phrase-routing.py"
      - "scripts/test-check-no-prompt-phrase-routing.py"
      - "scripts/check-orchestration-deterministic.sh"
      - "scripts/run-evals.sh"
      - "scripts/test-run-evals.py"
