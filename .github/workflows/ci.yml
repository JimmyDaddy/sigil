      - "scripts/test-check-test-layout.py"
      - "scripts/long-session-evidence.py"
      - "scripts/test-long-session-evidence.py"
      - "scripts/tui-stateful-pty-acceptance.py"
      - "scripts/test-tui-stateful-pty-acceptance.py"
      - "scripts/context-v1-binary-acceptance.py"
      - "scripts/image-attachment-v1-acceptance.py"
      - "scripts/tui-attention-signals-pty-acceptance.py"
      - "scripts/tui-feedback-pty-acceptance.py"
      - "scripts/tui-web-pty-acceptance.py"
      - "scripts/test-tui-web-pty-acceptance.py"
      - "scripts/build-release-archive.sh"
      - "scripts/extract-verified-desktop-updater-app.py"
      - "scripts/generate-desktop-update-manifest.mjs"
      - "scripts/desktop-notarization-state.mjs"
      - "scripts/finalize-desktop-macos-local.sh"
      - "scripts/package-desktop-macos-local.sh"
      - "scripts/status-desktop-macos-notarization.sh"
      - "scripts/upload-desktop-macos-release.sh"
      - "scripts/release-candidate.mjs"
      - "scripts/release-doctor.mjs"
      - "scripts/release-channel-version.mjs"
      - "scripts/publish-npm-packages.sh"
      - "scripts/verify-desktop-macos-app.sh"
      - "scripts/verify-desktop-macos.sh"
      - "scripts/test-desktop-macos-signing.mjs"
      - "scripts/test-desktop-notarization-state.mjs"
      - "scripts/test-extract-verified-desktop-updater-app.py"
      - "scripts/test-published-distribution-smoke.sh"
      - "scripts/test-publish-npm-packages.sh"
      - "scripts/test-release-tooling.mjs"
      - "scripts/test-product-surface-positioning.mjs"
      - "scripts/test-update-distribution-markers.mjs"
      - "scripts/select-published-desktop-beta.mjs"
      - "scripts/verify-desktop-update-signature.sh"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/desktop-package.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/published-distribution-smoke.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "fuzz/**"
      - "apps/desktop/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "dev/evals/**"
      - "scripts/coverage.sh"
      - "scripts/alpha-dogfood-campaign.py"
      - "scripts/test-alpha-dogfood-campaign.py"
      - "scripts/check-test-layout.py"
      - "scripts/check-no-prompt-phrase-routing.py"
      - "scripts/test-check-no-prompt-phrase-routing.py"
      - "scripts/check-orchestration-deterministic.sh"
      - "scripts/run-evals.sh"
      - "scripts/test-run-evals.py"
      - "scripts/tui-orchestration-pty-acceptance.py"
      - "scripts/test-tui-orchestration-pty-acceptance.py"
      - "scripts/generate-desktop-contract.sh"
      - "scripts/test-check-test-layout.py"
      - "scripts/long-session-evidence.py"
      - "scripts/test-long-session-evidence.py"
      - "scripts/tui-stateful-pty-acceptance.py"
      - "scripts/test-tui-stateful-pty-acceptance.py"
      - "scripts/context-v1-binary-acceptance.py"
      - "scripts/image-attachment-v1-acceptance.py"
      - "scripts/tui-attention-signals-pty-acceptance.py"
      - "scripts/tui-feedback-pty-acceptance.py"
      - "scripts/tui-web-pty-acceptance.py"
      - "scripts/test-tui-web-pty-acceptance.py"
      - "scripts/build-release-archive.sh"
      - "scripts/extract-verified-desktop-updater-app.py"
      - "scripts/generate-desktop-update-manifest.mjs"
      - "scripts/desktop-notarization-state.mjs"
      - "scripts/finalize-desktop-macos-local.sh"
      - "scripts/package-desktop-macos-local.sh"
      - "scripts/status-desktop-macos-notarization.sh"
      - "scripts/upload-desktop-macos-release.sh"
      - "scripts/release-candidate.mjs"
      - "scripts/release-doctor.mjs"
      - "scripts/release-channel-version.mjs"
      - "scripts/publish-npm-packages.sh"
      - "scripts/verify-desktop-macos-app.sh"
      - "scripts/verify-desktop-macos.sh"
      - "scripts/test-desktop-macos-signing.mjs"
      - "scripts/test-desktop-notarization-state.mjs"
      - "scripts/test-extract-verified-desktop-updater-app.py"
      - "scripts/test-published-distribution-smoke.sh"
      - "scripts/test-publish-npm-packages.sh"
      - "scripts/test-release-tooling.mjs"
      - "scripts/test-product-surface-positioning.mjs"
      - "scripts/test-update-distribution-markers.mjs"
      - "scripts/select-published-desktop-beta.mjs"
      - "scripts/verify-desktop-update-signature.sh"

permissions:
  contents: read

concurrency:
  # Supersede stale CI attempts during rapid push batches. Older attempts may
  # show GitHub's "operation was canceled" even when tests were still passing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_LLVM_COV_VERSION: 0.8.7
  RUST_TOOLCHAIN_VERSION: 1.94.1

jobs:
  dogfood-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify dogfood and distribution contracts
        run: |
          python3 scripts/test-alpha-dogfood-campaign.py
          python3 scripts/test-run-evals.py
          python3 scripts/test-tui-stateful-pty-acceptance.py
          python3 scripts/test-tui-orchestration-pty-acceptance.py
          python3 scripts/test-tui-web-pty-acceptance.py
          node scripts/test-desktop-macos-signing.mjs
          node scripts/test-desktop-notarization-state.mjs
          python3 scripts/test-extract-verified-desktop-updater-app.py
          node scripts/test-product-surface-positioning.mjs
          node scripts/test-update-distribution-markers.mjs
          node scripts/test-release-tooling.mjs
          scripts/test-publish-npm-packages.sh
          scripts/test-published-distribution-smoke.sh

      - name: Enforce physical Rust test layout
        run: |
          python3 scripts/test-check-test-layout.py
          python3 scripts/check-test-layout.py

      - name: Enforce model-owned prompt semantics
        run: |
          python3 scripts/test-check-no-prompt-phrase-routing.py
          python3 scripts/check-no-prompt-phrase-routing.py

      - name: Verify long-session evidence contract
        run: python3 scripts/test-long-session-evidence.py

  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  desktop-contract:
    name: Desktop contract and frontend
    needs: fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Verify generated contract and frontend
        run: pnpm --dir apps/desktop check

  check:
    needs:
      - dogfood-contracts
      - desktop-contract
      - fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev

      - name: cargo check --locked
        run: cargo check --locked

      - name: Compile Shell permission-plan fuzz target
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bin shell_permission_plan

      - name: Check updater release verifier
        run: >-
          cargo check --locked -p sigil-updater
          --features release-verifier
          --bin sigil-verify-tauri-update

  code-intel-rustdoc:
    name: Code intelligence public API docs
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Enforce documented code-intelligence façade
        run: cargo rustdoc --locked -p sigil-code-intel -- -D missing-docs

  orchestration-acceptance:
    name: Deterministic orchestration acceptance
    needs: fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run deterministic orchestration acceptance
        run: |
          node dev/evals/generate-orchestration-corpus.mjs --check
          ./scripts/check-orchestration-deterministic.sh

      - name: Build Sigil for orchestration PTY acceptance
        run: cargo build --locked -p sigil

      - name: Run model-owned orchestration real-PTY acceptance
        run: >-
          timeout 120s python3 scripts/tui-orchestration-pty-acceptance.py
          --binary target/debug/sigil

      - name: Upload orchestration PTY acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-orchestration-pty-acceptance
          path: .repo-local-dev/tui-orchestration-acceptance/**
          if-no-files-found: warn
          retention-days: 7

  platform-check:
    name: Platform reliability (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile macOS workspace and targets
        if: runner.os == 'macOS'
        run: cargo check --locked --workspace --all-targets

      - name: Compile Windows kernel targets
        if: runner.os == 'Windows'
        run: cargo check --locked -p sigil-kernel --all-targets

      - name: Test macOS runtime and execution surfaces
        if: runner.os == 'macOS'
        run: cargo test --locked -p sigil-kernel -p sigil-process -p sigil-tools-builtin -p sigil-code-intel -p sigil-runtime --lib -- --test-threads=1

      - name: Test Windows kernel durability
        if: runner.os == 'Windows'
        run: cargo test --locked -p sigil-kernel --lib

  platform-windows-mcp:
    name: Platform reliability (Windows MCP)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Windows MCP targets
        run: cargo check --locked -p sigil-process -p sigil-mcp --all-targets

      - name: Test Windows MCP transport
        run: cargo test --locked -p sigil-process -p sigil-mcp --lib -- --test-threads=1

  platform-windows-builtin:
    name: Platform reliability (Windows builtin)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Windows builtin targets
        run: cargo check --locked -p sigil-tools-builtin --all-targets

      - name: Test Windows builtin tools and terminal semantics
        run: cargo test --locked -p sigil-tools-builtin --lib -- --test-threads=2

  platform-windows-runtime:
    name: "Platform reliability (Windows runtime: ${{ matrix.name }})"
    needs: check
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-tools
            timeout: 30
            test-args: agent_tools
          - name: agent-supervisor
            timeout: 30
            test-args: agent_supervisor
          - name: session-lifecycle
            timeout: 30
            test-args: session_lifecycle
          - name: application-run
            timeout: 30
            test-args: application_run
          - name: provider-connections
            timeout: 30
            test-args: provider_connections
          - name: doctor
            timeout: 30
            test-args: doctor
          - name: plan-review
            timeout: 30
            test-args: plan_review_coordinator_tests
          - name: managed-resource-adapters
            timeout: 30
            test-args: managed_resource_adapters::tests
          - name: remainder
            timeout: 45
            test-args: >-
              --skip agent_tools
              --skip agent_supervisor
              --skip session_lifecycle
              --skip application_run
              --skip provider_connections
              --skip doctor
              --skip plan_review_coordinator_tests
              --skip managed_resource_adapters

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Windows runtime targets
        run: cargo check --locked -p sigil-runtime --all-targets

      - name: Test Windows runtime integration (${{ matrix.name }})
        run: cargo test --locked -p sigil-runtime --lib -- --test-threads=1 ${{ matrix.test-args }}

  platform-windows-http:
    name: Platform reliability (Windows HTTP)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Windows HTTP targets
        run: cargo check --locked -p sigil-http --all-targets

      - name: Test Windows HTTP durable journal
        run: cargo test --locked -p sigil-http --all-targets -- --test-threads=1

  oauth-keyring-conformance:
    name: Provider and OAuth keyring conformance (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Secret Service
            os: ubuntu-latest
          - name: macOS Keychain
            os: macos-latest
          - name: Windows Credential Manager
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Secret Service fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring

      - name: Test Linux Secret Service round trip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The single-quoted script is expanded by the nested bash, not this shell.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -eu -o pipefail -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked -p sigil-mcp native_system_keyring_round_trip_is_exact_and_cleanup_safe -- --ignored
            cargo test --locked -p sigil-runtime native_provider_credential_store_roundtrip_and_cleanup -- --ignored
          '

      - name: Test native credential-store round trip
        if: runner.os != 'Linux'
        run: |
          cargo test --locked -p sigil-mcp native_system_keyring_round_trip_is_exact_and_cleanup_safe -- --ignored
          cargo test --locked -p sigil-runtime native_provider_credential_store_roundtrip_and_cleanup -- --ignored

  test:
    name: Coverage shard (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-tools
            packages: "sigil-kernel sigil-process sigil-tools-builtin sigil-mcp"
          - name: providers
            packages: "sigil-provider-deepseek sigil-provider-openai-compat sigil-provider-openai-responses sigil-provider-anthropic sigil-provider-gemini"
          - name: automation-surfaces
            packages: "sigil-code-intel sigil-http sigil"
          - name: tui
            packages: "sigil-tui"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-${{ matrix.name }}

      - name: Install cargo-llvm-cov
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -q "$CARGO_LLVM_COV_VERSION"; then
            cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
          fi

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --profraw-only

      - name: cargo llvm-cov --no-report (${{ matrix.name }})
        run: >-
          COVERAGE_NO_REPORT=1 COVERAGE_PACKAGES="${{ matrix.packages }}"
          ./scripts/coverage.sh -- --test-threads=2

      - name: Archive coverage profiles
        run: tar -C target -czf coverage-${{ matrix.name }}.tar.gz llvm-cov-target

      - name: Upload coverage profiles
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: coverage-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  clippy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev

      - name: cargo clippy --locked --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy updater release verifier
        run: >-
          cargo clippy --locked -p sigil-updater
          --features release-verifier
          --bin sigil-verify-tauri-update
          -- -D warnings

  tui-web-v1-pty-acceptance:
    name: TUI Web V1 PTY acceptance
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build production Sigil binary
        run: cargo build --locked -p sigil

      - name: Run deterministic Web V1 real-PTY acceptance
        run: timeout 150s python3 scripts/tui-web-pty-acceptance.py --binary target/debug/sigil

      - name: Upload Web V1 PTY acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-web-v1-pty-acceptance
          path: .repo-local-dev/tui-smoke/tui-web-pty-acceptance-*
          if-no-files-found: warn
          retention-days: 7

  coverage:
    needs:
      - test
      - clippy
      - tui-web-v1-pty-acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download coverage profiles
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Install cargo-llvm-cov
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -q "$CARGO_LLVM_COV_VERSION"; then
            cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
          fi

      - name: Restore coverage profiles
        run: |
          mkdir -p target
          find coverage-artifacts -name "coverage-*.tar.gz" -print -exec tar -xzf {} -C target \;

      - name: coverage report
        run: COVERAGE_REPORT_ONLY=1 ./scripts/coverage.sh
