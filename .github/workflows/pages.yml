name: Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "README.md"
      - "README.zh-CN.md"
      - "assets/demo/**"
      - "assets/logo/**"
      - "assets/social/**"
      - "crates/sigil-runtime/src/application_catalog.rs"
      - "crates/sigil-tui/src/commands.rs"
      - "dev/docs/public-documentation-content-policy.json"
      - "docs/**"
      - "scripts/build-docs-site.rb"
      - "scripts/build-pages-site.sh"
      - "scripts/check-docs*"
      - "scripts/check-pages-site.sh"
      - "scripts/check-public-doc*"
      - "scripts/check-site-*"
      - "scripts/public-doc-metrics.rb"
      - "scripts/ruby-compat.rb"
      - "scripts/select-published-desktop-beta.mjs"
      - "scripts/test-desktop-macos-signing.mjs"
      - "scripts/test-docs-table-render.rb"
      - "scripts/test-public-doc-content.rb"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Locate browser for responsive layout checks
        run: |
          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "${candidate}" >/dev/null 2>&1; then
              browser="$(command -v "${candidate}")"
              break
            fi
          done
          if [[ -z "${browser}" ]]; then
            echo "Chrome or Chromium is required for responsive layout checks" >&2
            exit 1
          fi
          "${browser}" --version
          echo "SIGIL_SITE_BROWSER=${browser}" >> "${GITHUB_ENV}"

      - name: Check static site
        run: scripts/check-pages-site.sh

      - name: Prepare static site
        run: scripts/build-pages-site.sh _site

      - name: Preserve published Desktop update endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases_file="${RUNNER_TEMP}/sigil-published-releases.json"
          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${releases_file}"
          beta_tag="$(
            node scripts/select-published-desktop-beta.mjs \
              --repository "${GITHUB_REPOSITORY}" \
              --input "${releases_file}"
          )"
          if [[ -z "${beta_tag}" ]]; then
            echo "no published Desktop beta manifest to preserve"
            exit 0
          fi

          manifest_dir="${RUNNER_TEMP}/sigil-desktop-update"
          mkdir -p "${manifest_dir}" _site/updates/beta
          gh release download "${beta_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json \
            --dir "${manifest_dir}"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const tag = process.argv[2];
            const repository = process.env.GITHUB_REPOSITORY;
            if (`v${manifest.version}` !== tag) {
              throw new Error("Desktop update manifest version does not match beta release");
            }
            const expected = new Map([
              ["darwin-aarch64", "aarch64-apple-darwin"],
              ["darwin-x86_64", "x86_64-apple-darwin"],
            ]);
            if (
              manifest.platforms === null
              || typeof manifest.platforms !== "object"
              || Array.isArray(manifest.platforms)
              || Object.keys(manifest.platforms).sort().join(",")
                !== [...expected.keys()].sort().join(",")
            ) {
              throw new Error("Desktop update manifest has an unexpected platform inventory");
            }
            for (const [platform, target] of expected) {
              const entry = manifest.platforms[platform];
              const name = `Sigil_${manifest.version}_${target}.app.tar.gz`;
              const expectedUrl =
                `https://github.com/${repository}/releases/download/${tag}/${name}`;
              if (
                entry === null
                || typeof entry !== "object"
                || entry.url !== expectedUrl
                || typeof entry.signature !== "string"
                || entry.signature.length < 40
                || entry.signature.length > 4096
                || !/^[A-Za-z0-9+/]+={0,2}$/.test(entry.signature)
              ) {
                throw new Error(`unsafe Desktop update manifest entry for ${platform}`);
              }
            }
          ' "${manifest_dir}/latest.json" "${beta_tag}"
          cp "${manifest_dir}/latest.json" _site/updates/beta/latest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
