name: R71 Platform Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact unpublished r71-release-candidate commit SHA"
        required: true
        type: string
      base_sha:
        description: "Exact immutable base commit SHA"
        required: true
        type: string
      require_conformance:
        description: "Required R71 qualification; false is rejected"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: r71-platform-qualification-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: 1.94.1

jobs:
  macos-seatbelt:
    name: macos-seatbelt
    runs-on: macos-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate and required mode
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_CONFORMANCE: ${{ inputs.require_conformance }}
        run: |
          set -euo pipefail
          [[ "$REQUIRE_CONFORMANCE" == true ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Run Seatbelt qualification
        shell: bash
        env:
          SIGIL_R71_EVIDENCE_DIR: ${{ runner.temp }}/r71-evidence/macos-seatbelt
        run: |
          set -euo pipefail
          bash scripts/run-r71-release-qualification.sh \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --platform macos --backend seatbelt --required --suite platform
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r71-macos-seatbelt
          path: ${{ runner.temp }}/r71-evidence/macos-seatbelt
          if-no-files-found: error

  linux-bubblewrap:
    name: linux-bubblewrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate and required mode
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_CONFORMANCE: ${{ inputs.require_conformance }}
        run: |
          set -euo pipefail
          [[ "$REQUIRE_CONFORMANCE" == true ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Install Rust and Bubblewrap
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Install Bubblewrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap wget
      - name: Run full Linux qualification
        shell: bash
        env:
          SIGIL_R71_EVIDENCE_DIR: ${{ runner.temp }}/r71-evidence/linux-bubblewrap
        run: |
          set -euo pipefail
          bash scripts/run-r71-release-qualification.sh \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --platform linux --backend bubblewrap --required --suite full
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r71-linux-bubblewrap
          path: ${{ runner.temp }}/r71-evidence/linux-bubblewrap
          if-no-files-found: error

  windows-restricted:
    name: windows-restricted
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate and required mode
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_CONFORMANCE: ${{ inputs.require_conformance }}
        run: |
          set -euo pipefail
          [[ "$REQUIRE_CONFORMANCE" == true ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Run Windows restricted qualification
        shell: bash
        env:
          SIGIL_R71_EVIDENCE_DIR: ${{ runner.temp }}/r71-evidence/windows-restricted
        run: |
          set -euo pipefail
          bash scripts/run-r71-release-qualification.sh \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --platform windows --backend windows-restricted --required --suite platform
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r71-windows-restricted
          path: ${{ runner.temp }}/r71-evidence/windows-restricted
          if-no-files-found: error

  docker-declared:
    name: docker-declared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate and required mode
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_CONFORMANCE: ${{ inputs.require_conformance }}
        run: |
          set -euo pipefail
          [[ "$REQUIRE_CONFORMANCE" == true ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Pull declared qualification image
        run: docker pull alpine:3.20
      - name: Run Docker qualification
        shell: bash
        env:
          SIGIL_R71_DOCKER_CONFORMANCE_IMAGE: alpine:3.20
          SIGIL_R71_EVIDENCE_DIR: ${{ runner.temp }}/r71-evidence/docker-declared
        run: |
          set -euo pipefail
          export SIGIL_DOCKER_CONFORMANCE_IMAGE="$SIGIL_R71_DOCKER_CONFORMANCE_IMAGE"
          bash scripts/run-r71-release-qualification.sh \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --platform docker --backend docker --required --suite platform
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r71-docker-declared
          path: ${{ runner.temp }}/r71-evidence/docker-declared
          if-no-files-found: error

  toolchain-offline:
    name: toolchain-offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate and required mode
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_CONFORMANCE: ${{ inputs.require_conformance }}
        run: |
          set -euo pipefail
          [[ "$REQUIRE_CONFORMANCE" == true ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Warm Cargo dependency store
        shell: bash
        run: |
          set -euo pipefail
          CARGO_NET_OFFLINE=false cargo fetch --locked
      - name: Run toolchain qualification
        shell: bash
        env:
          SIGIL_R71_EVIDENCE_DIR: ${{ runner.temp }}/r71-evidence/toolchain-offline
        run: |
          set -euo pipefail
          bash scripts/run-r71-release-qualification.sh \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --platform toolchain --backend toolchain-offline --required --suite platform
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r71-toolchain-offline
          path: ${{ runner.temp }}/r71-evidence/toolchain-offline
          if-no-files-found: error
