name: Dependency Supply Chain

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dependency-supply-chain.yml"
      - ".github/dependabot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/desktop/package.json"
      - "apps/desktop/pnpm-lock.yaml"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "dev/governance/dependency-supply-chain.md"
      - "scripts/check-supply-chain-policy.py"
      - "scripts/test-check-supply-chain-policy.py"
  pull_request:
    paths:
      - ".github/workflows/dependency-supply-chain.yml"
      - ".github/dependabot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/desktop/package.json"
      - "apps/desktop/pnpm-lock.yaml"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "dev/governance/dependency-supply-chain.md"
      - "scripts/check-supply-chain-policy.py"
      - "scripts/test-check-supply-chain-policy.py"
  schedule:
    - cron: "17 18 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: 0.22.2
  RUST_TOOLCHAIN_VERSION: 1.94.1

jobs:
  changes:
    name: Resolve dependency audit scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      npm: ${{ steps.scope.outputs.npm }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed dependency inputs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rust_changed=false
          npm_changed=false

          if [[ "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            rust_changed=true
            npm_changed=true
          else
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base="${BASE_SHA}"
            else
              base="${BEFORE_SHA}"
            fi

            if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] ||
              [[ "${base}" =~ ^0+$ ]] ||
              ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              rust_changed=true
              npm_changed=true
            else
              while IFS= read -r path; do
                case "${path}" in
                  .github/workflows/dependency-supply-chain.yml | .github/dependabot.yml)
                    rust_changed=true
                    npm_changed=true
                    ;;
                  Cargo.lock | Cargo.toml | apps/desktop/src-tauri/Cargo.toml | crates/*/Cargo.toml | deny.toml | dev/governance/dependency-supply-chain.md | scripts/check-supply-chain-policy.py | scripts/test-check-supply-chain-policy.py)
                    rust_changed=true
                    ;;
                  apps/desktop/package.json | apps/desktop/pnpm-lock.yaml)
                    npm_changed=true
                    ;;
                esac
              done < <(git diff --name-only "${base}" "${GITHUB_SHA}")
            fi
          fi

          echo "rust=${rust_changed}" >> "${GITHUB_OUTPUT}"
          echo "npm=${npm_changed}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Dependency audit scope"
            echo
            echo "- Rust: ${rust_changed}"
            echo "- npm: ${npm_changed}"
          } >> "${GITHUB_STEP_SUMMARY}"

  policy-consistency:
    name: Advisory exception policy consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test policy consistency checker
        run: python3 scripts/test-check-supply-chain-policy.py

      - name: Match deny, audit, and governance exceptions
        run: python3 scripts/check-supply-chain-policy.py

  cargo-deny:
    name: Licenses, sources, bans, and advisories
    needs:
      - changes
      - policy-consistency
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce committed cargo-deny policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          command: check
          arguments: --all-features

  cargo-audit:
    name: Independent RustSec lockfile audit
    needs:
      - changes
      - policy-consistency
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Audit lockfile with reviewed exceptions
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0411
          --ignore RUSTSEC-2024-0412
          --ignore RUSTSEC-2024-0413
          --ignore RUSTSEC-2024-0414
          --ignore RUSTSEC-2024-0415
          --ignore RUSTSEC-2024-0416
          --ignore RUSTSEC-2024-0417
          --ignore RUSTSEC-2024-0418
          --ignore RUSTSEC-2024-0419
          --ignore RUSTSEC-2024-0420
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2025-0075
          --ignore RUSTSEC-2025-0080
          --ignore RUSTSEC-2025-0081
          --ignore RUSTSEC-2025-0098
          --ignore RUSTSEC-2025-0100
          --ignore RUSTSEC-2025-0141

  pnpm-audit:
    name: Desktop npm audit
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install locked desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Audit desktop dependency graph
        run: pnpm --dir apps/desktop audit --audit-level high

      - name: Smoke test patched desktop tooling
        run: pnpm --dir apps/desktop exec wdio --version
