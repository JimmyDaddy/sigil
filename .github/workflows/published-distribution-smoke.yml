name: Published Distribution Smoke

on:
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [sigil_published_distribution]
  schedule:
    - cron: "17 3 * * *"

permissions:
  attestations: read
  contents: read

concurrency:
  group: published-distribution-smoke-${{ github.event.release.tag_name || github.event.client_payload.tag || 'current-beta' }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  RELEASE_CHANNEL: beta
  RUST_TOOLCHAIN_VERSION: 1.94.1

jobs:
  resolve-release:
    name: Resolve current beta release
    if: >-
      ${{ (github.event_name != 'release' || contains(github.event.release.tag_name, '-beta.')) &&
          (github.event_name != 'repository_dispatch' || contains(github.event.client_payload.tag, '-beta.')) }}
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve matching npm and GitHub prerelease
        id: release
        shell: bash
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RELEASE_CHANNEL}" = "beta"
          if [[ "${GITHUB_EVENT_NAME}" == "release" || "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
              tag="${EVENT_RELEASE_TAG}"
            else
              tag="${EVENT_DISPATCH_TAG}"
            fi
            version="${tag#v}"
            if [[ "${tag}" != v* || "${version}" != *-beta.* ]]; then
              echo "published distribution smoke only admits beta releases: ${tag}" >&2
              exit 1
            fi
            npm_version=""
            for attempt in $(seq 1 20); do
              if npm_version="$(npm view "@sigil-ai/sigil@${RELEASE_CHANNEL}" version --json 2>/dev/null | jq -er '.' 2>/dev/null)" &&
                [[ "${npm_version}" == "${version}" ]]; then
                break
              fi
              if [[ "${attempt}" -eq 20 ]]; then
                echo "npm ${RELEASE_CHANNEL} did not converge to ${version}; observed ${npm_version:-nothing}" >&2
                exit 1
              fi
              sleep 30
            done
          else
            if ! version="$(npm view "@sigil-ai/sigil@${RELEASE_CHANNEL}" version --json 2>/dev/null | jq -er '.' 2>/dev/null)"; then
              if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
                echo "no published beta exists yet; scheduled smoke is not applicable"
                printf 'available=false\n' >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              echo "npm has no resolvable ${RELEASE_CHANNEL} release" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          case "${version}" in
            *-"${RELEASE_CHANNEL}" | *-"${RELEASE_CHANNEL}".*) ;;
            *)
              echo "npm ${RELEASE_CHANNEL} tag resolved to an unexpected version: ${version}" >&2
              exit 1
              ;;
          esac
          release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          )"
          test "$(jq -r '.draft' <<<"${release}")" = "false"
          test "$(jq -r '.prerelease' <<<"${release}")" = "true"
          test "$(jq -r '.tag_name' <<<"${release}")" = "${tag}"
          if [[ "$(jq -r '.immutable // false' <<<"${release}")" != "true" ]]; then
            echo "published smoke target ${tag} is not immutable" >&2
            exit 1
          fi
          test -n "${version}"
          {
            printf 'available=true\n'
            printf 'tag=%s\n' "${tag}"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"

  npm-install:
    name: npm ${{ matrix.label }}
    needs: resolve-release
    if: ${{ needs.resolve-release.outputs.available == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
          - label: Windows x64
            os: windows-latest
          - label: macOS arm64
            os: macos-latest
          - label: macOS Intel
            os: macos-15-intel
    steps:
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - name: Install current prerelease in an isolated directory
        shell: bash
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/sigil-npm-smoke"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}"
          cd "${work_dir}"
          npm init --yes >/dev/null
          npm install --save-exact "@sigil-ai/sigil@${VERSION}"
          npm ls "@sigil-ai/sigil@${VERSION}"

      - name: Verify binary and doctor JSON
        shell: bash
        env:
          SIGIL_CACHE_HOME: ${{ runner.temp }}/sigil-npm-cache
          SIGIL_STATE_HOME: ${{ runner.temp }}/sigil-npm-state
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/sigil-npm-smoke"
          npm exec -- sigil --version > version.txt
          grep -Fq "sigil ${VERSION}" version.txt
          npm exec -- sigil doctor --output json > doctor.json
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("doctor.json", "utf8"));
          if (report.schema_version !== 1) throw new Error("unexpected doctor schema");
          if (!report.build || report.build.version !== process.env.VERSION) {
            throw new Error("doctor build version does not match npm prerelease");
          }
          if (!report.privacy || report.privacy.review_before_sharing !== true) {
            throw new Error("doctor privacy projection is missing");
          }
          NODE

  github-release:
    name: GitHub Release and Desktop assets
    needs: resolve-release
    if: ${{ needs.resolve-release.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Install Rust signature verifier
        if: ${{ env.RELEASE_CHANNEL == 'beta' }}
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}"
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Download current prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/sigil-release-smoke"
          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums.txt' \
            --pattern 'sigil-*.tar.gz' \
            --pattern 'sigil-*-candidate.json' \
            --dir "${asset_dir}"

      - name: Verify aggregate checksums and expected platforms
        shell: bash
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/sigil-release-smoke"
          expected=(
            "sigil-${VERSION}-aarch64-apple-darwin.tar.gz"
            "sigil-${VERSION}-x86_64-apple-darwin.tar.gz"
            "sigil-${VERSION}-x86_64-pc-windows-msvc.tar.gz"
            "sigil-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          )
          for archive in "${expected[@]}"; do
            test -s "${asset_dir}/${archive}"
          done
          normalized="${asset_dir}/checksums.normalized.txt"
          : > "${normalized}"
          while read -r checksum path; do
            path="${path#\*}"
            printf '%s  %s\n' "${checksum}" "$(basename "${path}")" >> "${normalized}"
          done < "${asset_dir}/checksums.txt"
          test "$(wc -l < "${normalized}" | tr -d ' ')" = "${#expected[@]}"
          (cd "${asset_dir}" && sha256sum --check "$(basename "${normalized}")")

      - name: Verify immutable candidate manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/sigil-release-smoke"
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets,isDraft,isImmutable,tagName \
            > "${asset_dir}/release.json"
          node scripts/release-candidate.mjs verify \
            --manifest "${asset_dir}/sigil-${VERSION}-candidate.json" \
            --tag "${RELEASE_TAG}" \
            --commit "$(git rev-parse "${RELEASE_TAG}^{commit}")" \
            --release-json "${asset_dir}/release.json"

      - name: Verify GitHub artifact attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/sigil-release-smoke"
          for archive in "${asset_dir}/sigil-${VERSION}-"*.tar.gz; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Verify beta Desktop assets and update endpoint
        if: ${{ env.RELEASE_CHANNEL == 'beta' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          desktop_dir="${RUNNER_TEMP}/sigil-desktop-smoke"
          mkdir -p "${desktop_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'Sigil_*.dmg' \
            --pattern 'Sigil_*.dmg.sha256' \
            --pattern 'Sigil_*.app.tar.gz' \
            --pattern 'Sigil_*.app.tar.gz.sha256' \
            --pattern 'Sigil_*.app.tar.gz.sig' \
            --pattern latest.json \
            --dir "${desktop_dir}"

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for suffix in dmg dmg.sha256 app.tar.gz app.tar.gz.sha256 app.tar.gz.sig; do
              test -s "${desktop_dir}/Sigil_${VERSION}_${target}.${suffix}"
            done
            (
              cd "${desktop_dir}"
              shasum -a 256 --check "Sigil_${VERSION}_${target}.dmg.sha256"
              shasum -a 256 --check "Sigil_${VERSION}_${target}.app.tar.gz.sha256"
            )
            scripts/verify-desktop-update-signature.sh \
              --archive "${desktop_dir}/Sigil_${VERSION}_${target}.app.tar.gz" \
              --signature "${desktop_dir}/Sigil_${VERSION}_${target}.app.tar.gz.sig"
          done

          if scripts/verify-desktop-update-signature.sh \
            --archive "${desktop_dir}/Sigil_${VERSION}_aarch64-apple-darwin.app.tar.gz" \
            --signature "${desktop_dir}/Sigil_${VERSION}_x86_64-apple-darwin.app.tar.gz.sig"; then
            echo "swapped Desktop updater signature unexpectedly verified" >&2
            exit 1
          else
            verification_status=$?
            if [[ "${verification_status}" -ne 1 ]]; then
              echo "swapped-signature negative control could not complete verification" >&2
              exit "${verification_status}"
            fi
          fi

          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 20 --retry-delay 30 --retry-all-errors \
            --output "${desktop_dir}/pages-latest.json" \
            "https://sigil.corerobin.com/updates/beta/latest.json"
          cmp "${desktop_dir}/latest.json" "${desktop_dir}/pages-latest.json"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.version !== process.env.VERSION) throw new Error("unexpected update version");
            const expected = new Map([
              ["darwin-aarch64", "aarch64-apple-darwin"],
              ["darwin-x86_64", "x86_64-apple-darwin"],
            ]);
            if (
              manifest.platforms === null
              || typeof manifest.platforms !== "object"
              || Array.isArray(manifest.platforms)
              || Object.keys(manifest.platforms).sort().join(",")
                !== [...expected.keys()].sort().join(",")
            ) {
              throw new Error("unexpected Desktop update platform inventory");
            }
            for (const [platform, target] of expected) {
              const entry = manifest.platforms[platform];
              const name = `Sigil_${process.env.VERSION}_${target}.app.tar.gz`;
              const expectedUrl =
                `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${name}`;
              if (entry?.url !== expectedUrl) {
                throw new Error(`unsafe update URL or asset name for ${platform}`);
              }
              const signature = fs.readFileSync(
                `${process.argv[2]}/${name}.sig`,
                "utf8",
              ).trim();
              if (
                entry.signature !== signature
                || signature.length < 40
                || signature.length > 4096
                || !/^[A-Za-z0-9+/]+={0,2}$/.test(signature)
              ) {
                throw new Error(`invalid update signature for ${platform}`);
              }
            }
          ' "${desktop_dir}/latest.json" "${desktop_dir}"

  homebrew-install:
    name: Homebrew ${{ matrix.label }}
    needs: resolve-release
    if: ${{ needs.resolve-release.outputs.available == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            architecture: arm64
          - label: macOS Intel
            os: macos-15-intel
            architecture: x86_64
    steps:
      - name: Wait for the public tap to converge
        shell: bash
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          formula="${RUNNER_TEMP}/sigil-ai.rb"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "${formula}" \
              "https://raw.githubusercontent.com/JimmyDaddy/homebrew-sigil/main/Formula/sigil-ai.rb" &&
              grep -Fq "version \"${VERSION}\"" "${formula}"; then
              break
            fi
            if [[ "${attempt}" -eq 20 ]]; then
              echo "Homebrew tap did not converge to ${VERSION}" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Install from the public tap
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"
          brew tap JimmyDaddy/sigil
          brew install JimmyDaddy/sigil/sigil-ai
          sigil --version > version.txt
          grep -Fq "sigil ${VERSION}" version.txt
          brew info --json=v2 JimmyDaddy/sigil/sigil-ai > brew-info.json
          ruby -rjson -e '
            info = JSON.parse(File.read(ARGV.fetch(0)))
            actual = info.fetch("formulae").fetch(0).fetch("versions").fetch("stable")
            abort "unexpected Homebrew version #{actual}" unless actual == ENV.fetch("VERSION")
          ' brew-info.json

      - name: Verify doctor JSON
        shell: bash
        env:
          SIGIL_CACHE_HOME: ${{ runner.temp }}/sigil-brew-cache
          SIGIL_STATE_HOME: ${{ runner.temp }}/sigil-brew-state
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          sigil doctor --output json > doctor.json
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            abort "unexpected doctor schema" unless report.fetch("schema_version") == 1
            version = report.fetch("build").fetch("version")
            abort "unexpected doctor build version #{version}" unless version == ENV.fetch("VERSION")
            abort "missing privacy review" unless report.fetch("privacy").fetch("review_before_sharing")
          ' doctor.json
