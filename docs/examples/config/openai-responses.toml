config_version = 2

[workspace]
root = "."

[agent]
connection = "openai-default"
model = "gpt-4.1"
tool_timeout_secs = 30

[permission]
mode = "manual"

[connections.openai-default]
label = "OpenAI"
provider = "openai"
protocol = "responses"
base_url = "https://api.openai.com/v1"
credential = { source = "environment", name = "SIGIL_OPENAI_RESPONSES_API_KEY" }
