# R70.4 / T12 / E13 real production-surface registration.
#
# This is a registration contract, not a fixture or a pass-only baseline.  A surface is
# qualification-ready only after the listed production entries are exercised against the one
# shared fixture and emit the normalized receipt/frontier/event evidence below.
schema_version = "r70.4.t12-e13.real-production-surface-v1"
qualification = "T12/E13"
operation = "cancel_current_run"
required_surface_ids = ["tui-keyboard", "tui-mouse", "cli", "http", "desktop"]
excluded_unit_test = "crates/sigil-application/src/tests/lib_tests.rs::five_surface_clients_share_frontier_page_and_domain_receipt"

[shared_fixture]
id = "t12-e13-shared-authority-fixture-v1"
status = "missing"
owner = "application/runtime composition"
reason = "No production fixture currently drives one logical command through all five real entries and exposes the same durable receipt/frontier/event comparison."
source_files = [
  "crates/sigil/tests/common.rs",
  "crates/sigil/tests/serve_process_tests.rs",
  "crates/sigil/tests/session_lifecycle_tui_process_tests.rs",
  "crates/sigil-http/src/tests/production_driver_tests.rs",
]
required_artifacts = [
  "explicit fixture state/cache/workspace roots",
  "one authenticated application scope and session scope",
  "one durable application reservation and projection owner",
  "one provider fixture usable by every real entry",
]

[normalization]
receipt_fields = [
  "command_id",
  "command_kind",
  "frontier.scope",
  "frontier.writer_generation",
  "frontier.stream_generation",
  "frontier.through_sequence",
  "settlement",
  "domain_commit.source_event_id",
  "domain_commit.source_sequence",
  "domain_commit.source_digest",
  "outcome",
]
frontier_fields = [
  "scope",
  "writer_generation",
  "stream_generation",
  "through_sequence",
]
domain_event_fields = [
  "event_id",
  "base_frontier",
  "next_frontier",
  "payload_digest",
  "payload.event_kind",
]
outcome_fields = [
  "receipt_variant",
  "settlement",
  "effect_count",
  "terminal_status",
  "error_code",
]
identity_fields = [
  "application_instance_id",
  "authenticated_subject",
  "workspace_scope_id",
  "session_scope_id",
  "client_epoch",
  "command_id",
  "command_fingerprint",
]
comparison = "exact equality after replacing only per-run opaque ids with the fixture identity map; no connection label is a comparison key"

[rerun]
same_command_id = true
same_command_fingerprint = true
replay_must_be = "Replayed(ApplicationDomainReceipt) or ReplayedUncertain(UncertainCommandReceipt)"
boundary_metadata = ["reservation_phase", "dispatch_phase", "domain_commit_phase", "settlement_phase", "process_epoch", "crash_observed"]

[[crash_boundaries]]
id = "after-reservation-before-dispatch"
required_receipt = "Uncertain or ConfirmedNoEffect; never a fresh dispatch"

[[crash_boundaries]]
id = "after-dispatch-before-domain-commit"
required_receipt = "Uncertain with durable recovery binding"

[[crash_boundaries]]
id = "after-domain-commit-before-settlement"
required_receipt = "Replayed(ApplicationDomainReceipt) without duplicate effect"

[[crash_boundaries]]
id = "after-settlement-before-client-response"
required_receipt = "Replayed(ApplicationDomainReceipt) with the original domain commit"

