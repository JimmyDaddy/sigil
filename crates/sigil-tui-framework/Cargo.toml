[package]
name = "sigil-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Application-neutral terminal UI framework facade"
readme = "README.md"
repository = "https://github.com/JimmyDaddy/sigil"
documentation = "https://docs.rs/sigil-tui"
keywords = ["terminal", "tui", "ratatui", "ui"]
categories = ["gui", "command-line-interface"]

[dependencies]
sigil-tui-core = { version = "0.1.0", path = "../sigil-tui-core" }
sigil-tui-ratatui = { version = "0.1.0", path = "../sigil-tui-ratatui" }

[features]
default = ["crossterm"]
crossterm = []
serde = []
syntax = []
image = []
tracing = []
test-util = []

[lints]
workspace = true
