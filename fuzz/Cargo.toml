[package]
name = "sigil-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
sigil-kernel = { path = "../crates/sigil-kernel" }
sigil-tools-builtin = { path = "../crates/sigil-tools-builtin" }

[[bin]]
name = "shell_permission_plan"
path = "fuzz_targets/shell_permission_plan.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
