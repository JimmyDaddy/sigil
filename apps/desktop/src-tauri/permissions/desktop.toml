[[permission]]
identifier = "allow-desktop-bootstrap"
description = "Allows the main local window to read secret-free desktop connection state."
commands.allow = ["desktop_bootstrap"]

[[permission]]
identifier = "allow-desktop-appearance"
description = "Allows the main local window to save one bounded application appearance enum and synchronize native chrome."
commands.allow = ["desktop_set_appearance"]

[[permission]]
identifier = "allow-desktop-external-url"
description = "Allows the main local window to open one native-validated HTTPS URL without exposing a generic opener capability."
commands.allow = ["desktop_open_external_url"]

[[permission]]
identifier = "allow-desktop-pick-workspace"
description = "Allows the Rust backend to show a native folder picker and open one supervised workspace server."
commands.allow = ["desktop_pick_workspace"]

[[permission]]
identifier = "allow-desktop-close-workspace"
description = "Allows the main local window to close one owned workspace server after active-run confirmation."
commands.allow = ["desktop_close_workspace"]

[[permission]]
identifier = "allow-desktop-open-recent-workspace"
description = "Allows the Rust backend to reopen one native-stored recent workspace without disclosing its path."
commands.allow = ["desktop_open_recent_workspace"]

[[permission]]
identifier = "allow-desktop-catalog"
description = "Allows the main local window to query the bounded server-owned session catalog."
commands.allow = ["desktop_catalog"]

[[permission]]
identifier = "allow-desktop-session-batch"
description = "Allows the main local window to preview and execute one server-revalidated bounded batch of conversation mutations."
commands.allow = ["desktop_plan_session_catalog_batch", "desktop_execute_session_catalog_batch"]

[[permission]]
identifier = "allow-desktop-session"
description = "Allows the main local window to create, reopen, read, rename, quarantine, or confirm deletion of one bounded server-owned conversation source, including bounded typed artifact pages."
commands.allow = ["desktop_create_session", "desktop_open_session", "desktop_rename_session", "desktop_delete_session", "desktop_quarantine_session", "desktop_delete_invalid_session_source", "desktop_transcript", "desktop_display", "desktop_continuity", "desktop_run_context", "desktop_agent_activity", "desktop_read_tool_artifact"]

[[permission]]
identifier = "allow-desktop-run"
description = "Allows the main local window to start, reattach, or cooperatively cancel one run through the authenticated local server."
commands.allow = ["desktop_start_run", "desktop_attach_run", "desktop_cancel_run"]

[[permission]]
identifier = "allow-desktop-task-control"
description = "Allows the main local window to pause or continue one exact durable Task and review or accept one stale-safe integration preview."
commands.allow = ["desktop_continue_task", "desktop_pause_task", "desktop_task_integration_review", "desktop_accept_task_integration"]

[[permission]]
identifier = "allow-desktop-conversation-queue"
description = "Allows the main local window to inspect and mutate one bounded durable follow-up queue through generation-guarded commands."
commands.allow = ["desktop_conversation_queue", "desktop_command_conversation_queue"]

[[permission]]
identifier = "allow-desktop-conversation-recovery"
description = "Allows the main local window to preview and apply exact durable context compaction, inspect checkpoints, preview controlled-file reverse diffs, restore controlled files, or fork conversation history."
commands.allow = ["desktop_conversation_recovery", "desktop_conversation_compaction_preview", "desktop_compact_conversation", "desktop_checkpoint_restore_preview", "desktop_command_conversation_recovery"]

[[permission]]
identifier = "allow-desktop-approval"
description = "Allows the main local window to resolve one exact server-guarded approval request."
commands.allow = ["desktop_resolve_approval"]

[[permission]]
identifier = "allow-desktop-verification"
description = "Allows the main local window to inspect and rerun one exact server-projected verification check."
commands.allow = ["desktop_verification", "desktop_rerun_verification"]

[[permission]]
identifier = "allow-desktop-intent-stack"
description = "Allows the main local window to inspect bounded Intent history, preview one exact leaf Drop, and confirm its digest-bound operation."
commands.allow = ["desktop_intent_stack", "desktop_preview_intent_drop", "desktop_execute_intent_drop"]

[[permission]]
identifier = "allow-desktop-support"
description = "Allows the main local window to read redacted diagnostics and ask the native shell to save a private support report."
commands.allow = ["desktop_support_doctor", "desktop_export_support_bundle"]

[[permission]]
identifier = "allow-desktop-provider-setup"
description = "Allows the main local window to inspect secret-free provider readiness and submit one native-owned provider catalog, atomic setup, or explicit invalid-configuration replacement request."
commands.allow = ["desktop_provider_connections", "desktop_provider_setup_catalog", "desktop_save_provider_setup"]

[[permission]]
identifier = "allow-desktop-update"
description = "Allows the main local window to inspect and explicitly apply one native-owned signed Desktop beta update without generic updater or process access."
commands.allow = ["desktop_update_state", "desktop_check_for_update", "desktop_download_and_install_update", "desktop_restart_after_update"]
