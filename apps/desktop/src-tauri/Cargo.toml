[package]
name = "sigil-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "sigil_desktop_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
sigil-desktop = { path = "../../../crates/sigil-desktop" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lints]
workspace = true
